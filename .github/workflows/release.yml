name: release

# Stage 9 (act 9b R18). Three kinds of job, each with only the rights it needs:
#
#   test     -- the selftests (isolated FACE_UNLOCK_HOME) and the Credential Provider unit tests
#   build    -- per variant (cpu, gpu): builds and gates the bundle and an UNSIGNED installer.
#               Read-only token, no secrets, checkout without persisted credentials, every pip
#               install hash-checked (--require-hashes).
#   sign     -- per variant, only when Azure Trusted Signing is configured (repository variables
#               AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_CODESIGN_*): OIDC login, no repository
#               rights; signs the CP DLL and our unsigned PE files (never NVIDIA's), re-runs the gate
#               on the signed bundle and compiles the installer with SignTool + SignedUninstaller.
#   publish  -- only for a vX.Y.Z tag, the ONLY job with contents: write; creates a DRAFT release
#               (the operator smokes the artefacts, then publishes by hand -- F-223).
#
# Assets: WindowsFaceUnlock-Setup-<ver>-cpu.exe and -gpu.exe, each with .sha256 and
# .buildinfo.json. Neither contains a recognition model (the installer downloads them; the gate
# fails the build otherwise).
#
# Pinned: every action by full commit SHA (tag in the comment), Python by patch version, Inno Setup
# by version and installer SHA-256, every Python package by the hashes in requirements*.lock and
# installer/requirements-build.txt. NOT pinned: the runner image (windows-2022) and with it the
# MSVC toolset and CMake that build the CP DLL; their versions go into the build log (D-112).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  INNO_VERSION: "6.7.3"
  INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (hash-checked)
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # the frozen-gate tests (verifier, frozen_custody) read PyInstaller's archive format
          python -m pip install --require-hashes -r installer/requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Selftests (each with its own TEMP and a FACE_UNLOCK_HOME inside it)
        shell: pwsh
        run: |
          # R20: a selftest refuses a home outside the temporary directory, so TEMP comes first.
          $fail = @()
          foreach ($t in Get-ChildItem tools -Filter '*_selftest.py') {
            $tmp_ = Join-Path $env:RUNNER_TEMP ("t-" + $t.BaseName)
            New-Item -ItemType Directory -Force -Path $tmp_ | Out-Null
            $env:TEMP = $tmp_
            $env:TMP = $tmp_
            $env:FACE_UNLOCK_HOME = Join-Path $tmp_ "home"
            python -m ("tools." + $t.BaseName)
            if ($LASTEXITCODE) { $fail += $t.BaseName }
          }
          if ($fail) { Write-Error ("failed: " + ($fail -join ', ')); exit 1 }
      - name: Credential Provider unit tests
        shell: pwsh
        run: |
          cmake --version
          cmake -S credential_provider/tests -B build-tests -A x64
          cmake --build build-tests --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-tests/Release/test_parser.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  build:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (hash-checked)
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          $lock = if ($env:VARIANT -eq 'gpu') { 'requirements-gpu.lock' } else { 'requirements.lock' }
          python -m pip install --require-hashes -r $lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r installer/requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install Inno Setup (pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'is-' + $env:INNO_VERSION.Replace('.', '_')
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION.exe" -OutFile $exe
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower() -ne $env:INNO_SHA256) { throw 'Inno Setup hash mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$dir`"")
          if ($p.ExitCode -ne 0) { throw "Inno Setup installer exited $($p.ExitCode)" }
          "INNO_SETUP_ISCC=$(Join-Path $dir 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check the tag against the version (F-222)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { Write-Error "not a release tag: $env:REF_NAME"; exit 1 }
          $v = python -c "from face_service._version import __version__ as v; print(v)"
          if ("v$v" -ne $env:REF_NAME) { Write-Error "tag $env:REF_NAME != face_service/_version.py $v"; exit 1 }
      - name: Build (unsigned in this job)
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cmake --version
          python installer/build.py --variant $env:VARIANT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: installer-${{ matrix.variant }}-unsigned
          path: |
            installer_output/WindowsFaceUnlock-Setup-*-${{ matrix.variant }}.exe*
            dist/WindowsFaceUnlock.gate.json
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-${{ matrix.variant }}
          path: |
            dist/WindowsFaceUnlock
            dist/WindowsFaceUnlock.build-env.json
          retention-days: 3

  sign:
    needs: build
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: windows-2022
    timeout-minutes: 120
    environment: release-signing
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (hash-checked)
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          $lock = if ($env:VARIANT -eq 'gpu') { 'requirements-gpu.lock' } else { 'requirements.lock' }
          python -m pip install --require-hashes -r $lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r installer/requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-${{ matrix.variant }}
          path: dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign, re-gate, package (signing tools are provisioned in 9f)
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CODESIGN_ENDPOINT: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
          AZURE_CODESIGN_ACCOUNT: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
          AZURE_CODESIGN_PROFILE: ${{ vars.AZURE_CODESIGN_PROFILE }}
          FU_SIGN_SUBJECT: ${{ vars.FU_SIGN_SUBJECT }}
        run: |
          python installer/build.py --variant $env:VARIANT --resign
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python installer/build.py --variant $env:VARIANT --half 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: installer-${{ matrix.variant }}-signed
          path: |
            installer_output/WindowsFaceUnlock-Setup-*-${{ matrix.variant }}.exe*
            dist/WindowsFaceUnlock.gate.json

  publish:
    needs: [build, sign]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.sign.result != 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: installer-*
          path: out
      - name: Pick the signed build when there is one
        shell: bash
        run: |
          mkdir release
          for v in cpu gpu; do
            src="out/installer-$v-signed"; [ -d "$src" ] || src="out/installer-$v-unsigned"
            cp "$src"/installer_output/* release/
          done
          ls -l release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: release/*
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: true
